# Bundle patch for dsh-browserbase-provider.
#
# Two rows, both with an explicit id:
#   browser-use          — the seam that owns the single provider slot
#   browserbase-provider — this package, which claims it
# Nothing shipped is overridden.
- insert:
    - id: browser-use
      name: '@deepseek-ai/dsh-browser-use'
    - id: browserbase-provider
      name: 'dsh-browserbase-provider'
